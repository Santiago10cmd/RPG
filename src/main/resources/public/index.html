<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RPG - Vista HTML (Server-Side)</title>
</head>
<body>

    <h1>Panel de Héroes RPG</h1>

    <!-- FORMULARIO ESTÁNDAR HTML (Sin JavaScript: envía por POST directo al servidor) -->
    <h2>Registrar Nuevo Personaje</h2>
    <form action="/personajes" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="clase">Clase:</label>
        <select id="clase" name="clase">
            <option value="Guerrero">Guerrero</option>
            <option value="Mago">Mago</option>
            <option value="Arquero">Arquero</option>
        </select>
        <br><br>

        <label for="nivel">Nivel:</label>
        <input type="number" id="nivel" name="nivel" value="1">
        <br><br>

        <label for="vida">Vida:</label>
        <input type="number" id="vida" name="vida" value="100">
        <br><br>

        <button type="submit">Guardar Personaje</button>
    </form>

    <hr>

    <!-- TABLA HTML PURA (Sin JavaScript ni fetch) -->
    <h2>Lista de Personajes</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Clase</th>
                <th>Nivel</th>
            </tr>
        </thead>
        <tbody>
            <!--FILAS_PERSONAJES-->
        </tbody>
    </table>

</body>
</html>
